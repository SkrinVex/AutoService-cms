name: Build Windows Application

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Configure CMake
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Stage files for deployment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (Test-Path "build/Release/AutoService.exe") {
              Copy-Item -Path "build/Release/AutoService.exe" -Destination dist/
          } else {
              Copy-Item -Path "build/AutoService.exe" -Destination dist/
          }

      - name: Run windeployqt
        shell: pwsh
        run: |
          windeployqt --release --compiler-runtime --plugindir dist/plugins dist/AutoService.exe

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath AutoService-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoService-Windows-x64
          path: AutoService-Windows-x64.zip
          retention-days: 14
